model:
  name: mamba2
  params:
    # Anti-overfit rev 2. Falls back to mambapy (pure-PyTorch Mamba-1)
    # because d_model=128 is outside the native CUDA kernel's strides
    # constraint. ~3x slower per epoch but eliminates the 4M-param blow-up.
    d_model: 128
    num_layers: 3
    headdim: 64
    dropout: 0.3              # 0.1 -> 0.3 (also gates *between* blocks now)
    drop_path: 0.1            # stochastic depth, linear schedule across layers
    backend: auto             # auto picks mambapy at d_model=128

data:
  train_path: competition_package/datasets/train.parquet
  valid_path: competition_package/datasets/valid.parquet
  val_fraction: 0.0
  seed: 0
  scaling: standard

training:
  epochs: 80                  # 25 -> 80 (we have headroom)
  batch_size: 32              # 16 -> 32 (less gradient noise)
  learning_rate: 2.0e-4       # 5e-4 -> 2e-4 (model was overshooting in 2 epochs)
  weight_decay: 5.0e-4        # 1e-4 -> 5e-4
  warmup_epochs: 3            # 2 -> 3
  grad_clip: 1.0
  eval_every: 1
  device: auto
  amp: true
  seed: 0
  loss_name: weighted_pearson
  ema_decay: 0.999            # NEW: Polyak averaging of weights
  early_stopping_patience: 12 # 5 -> 12 (lower LR needs more time)

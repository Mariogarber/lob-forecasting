model:
  name: deeplob
  params:
    window_size: 100
    lstm_hidden: 64
    c1: 16
    c2: 16
    c3: 32
    inception_channels: 32
    dropout: 0.1

data:
  train_path: competition_package/datasets/train.parquet
  valid_path: competition_package/datasets/valid.parquet
  val_fraction: 0.0
  seed: 0
  scaling: standard

training:
  epochs: 25
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  grad_clip: 1.0
  eval_every: 1
  device: auto
  amp: true
  seed: 0
  loss_name: weighted_pearson
  early_stopping_patience: 5
